# Builds the Windows installer on GitHub's own Windows computers.
# Runs when a version tag (v0.1.0, v0.2.0…) is pushed, or by hand from the Actions tab.
# The installer appears on the repository's Releases page.
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'MAGIS Accounts ${{ github.ref_name }}'
          releaseBody: 'Windows: download the -setup.exe below and install it over the old version. Your data file (.db) is not touched.'
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

  # The centre's server (mini-PC): server program + its own Node.js + the screens, in one installer.
  server:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:server
      - name: Node.js for Windows (verified download)
        shell: pwsh
        run: |
          $v = 'v22.20.0'
          $zip = "node-$v-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/$v/$zip" -OutFile $zip
          $sums = (Invoke-WebRequest "https://nodejs.org/dist/$v/SHASUMS256.txt").Content -split "`n"
          $expected = (($sums | Where-Object { $_ -match " $zip$" }) -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "Node.js checksum mismatch" }
          Expand-Archive $zip -DestinationPath nodezip
          New-Item -ItemType Directory -Force server/windows/stage | Out-Null
          Copy-Item "nodezip/node-$v-win-x64/node.exe" server/windows/stage/magis-node.exe
          Copy-Item server-dist/server.mjs server/windows/stage/
          Copy-Item -Recurse server-dist/web server/windows/stage/web
      - name: Installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$ver" server/windows/installer.nsi
      - name: Attach to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" (Get-ChildItem server/windows/MAGIS-Server_*_setup.exe).FullName --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: server-setup
          path: server/windows/MAGIS-Server_*_setup.exe
