[package]
name = "magis-accounts"
version = "0.6.0"
description = "MAGIS cash accounting (offline)"
edition = "2021"

[lib]
name = "magis_accounts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
# talking to the centre's server (HTTPS with its own certificate, pinned on first use)
ureq = { version = "2.12", default-features = false, features = ["tls"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
ring = "0.17"

[profile.release]
opt-level = "s"
lto = true
strip = true
