<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAGIS Calendar — clickable model</title>
<style>
:root{--text:#26292E;--muted:#6b6f76;--faint:#9a9da3;--line:#e6e2d8;--line2:#cfcbbf;--paper:#FDFCF9;--soft:#f3f1ea;--acc:#185FA5;--acc-bg:#EAF2FB;--warn:#854F0B;--warn-bg:#FAEEDA;--err:#A32D2D;--err-bg:#FCEBEB;--ok:#3B6D11}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:13px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line2);background:#fff;border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:#26292E;color:#fff;border-color:#26292E}
.btn.dan{color:var(--err)}
.btn.on{background:var(--acc-bg);color:var(--acc);border-color:#9cc1e6}
select,input[type=text],input[type=date],input[type=time],input[type=number]{border:1px solid var(--line2);border-radius:8px;padding:4px 8px;background:#fff}
.demo{background:#26292E;color:#fff;font-size:12px;padding:6px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo select{padding:2px 6px;color:var(--text)}
.demo .btn{color:var(--text);padding:2px 10px}
.demo .sp{flex:1}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top h2{margin:0 6px;font-size:16px;font-weight:600}
.sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:4px 12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--soft);color:var(--text);font-weight:600}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 14px}
.pill{border:1px solid var(--line2);border-radius:999px;padding:2px 11px;background:#fff;cursor:pointer;color:var(--muted)}
.pill.on{background:var(--acc-bg);color:var(--acc);border-color:#9cc1e6}
.key{font-size:11px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.key i{display:inline-block;width:18px;height:10px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:0 14px 10px}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 10px;text-align:start;cursor:pointer;font:inherit;color:inherit;width:100%}
.tile:hover{border-color:#9cc1e6}
.tile em{font-style:normal;font-size:11px;color:var(--err);display:block}
.pre{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.pre button{font-size:11px;padding:2px 8px}
.res{border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px;cursor:pointer}.res:hover{background:#f7f9fc}.res small{display:block;color:var(--muted)}
.row3{display:flex;gap:6px;align-items:center;justify-content:space-between}
.tile b{display:block;font-size:19px;font-weight:600}
.tile small{color:var(--muted)}
.tile.w{background:var(--warn-bg);border-color:#efd5a8}.tile.w b,.tile.w small{color:var(--warn)}
.board{margin:0 14px 30px;border:1px solid var(--line);border-radius:10px;background:#fff;overflow:hidden}
.rw{display:flex;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.nm{width:150px;flex:none;padding:6px 10px;font-size:12px}
.nm small{display:block;color:var(--faint);font-size:11px}
.tr{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.hd .c{grid-row:1;text-align:center;padding:6px 0;font-size:11px;color:var(--muted);border-inline-start:1px solid var(--line)}
.hd .c.today{color:var(--acc);font-weight:700}
.cell{grid-row:1/3;border-inline-start:1px solid var(--line);padding:2px 3px 3px;min-height:36px;cursor:pointer;min-width:0}
.cell:hover{background:#f7f9fc}
.sun{background:#faf7ef}.today-c{background:#EEF5FC}
.closed{background:repeating-linear-gradient(45deg,#f5efe0 0 6px,#fff 6px 12px)}
.bar{grid-row:1;z-index:2;margin:3px 2px 0;height:22px;border-radius:6px;font-size:11px;display:flex;align-items:center;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
.chip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;border-radius:5px;padding:2px 5px;margin:2px 0 0;font-size:11px;line-height:1.25;overflow:hidden;overflow-wrap:break-word;cursor:pointer}
.chip b{display:block}
.chip b{font-weight:600;margin-inline-end:3px}
.opt{background:#fff!important;border:1.5px dashed currentColor}
.leave{display:block;color:var(--faint);font-size:10px;padding:0 4px;white-space:nowrap}
.ah{padding:6px 10px;background:var(--soft);font-weight:600;font-size:12px;cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line)}
.ah i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ah small{font-weight:400;color:var(--muted)}
.hours{flex:1;position:relative;height:24px}
.hours span{position:absolute;top:5px;font-size:10px;color:var(--faint);transform:translateX(-50%)}
[dir=rtl] .hours span{transform:translateX(50%)}
.dtr{flex:1;position:relative;min-height:38px;cursor:pointer;background-image:repeating-linear-gradient(to right,var(--line) 0 1px,transparent 1px calc(100%/14))}
.blk{position:absolute;top:4px;bottom:4px;border-radius:6px;font-size:11px;padding:2px 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;z-index:2}
.blk.stay{top:auto;bottom:3px;height:12px;padding:0 6px;font-size:10px;line-height:12px;opacity:.85}
.now{position:absolute;top:0;bottom:0;width:2px;background:#E24B4A;z-index:3}
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.mh{text-align:center;padding:6px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line)}
.md{min-height:96px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);padding:4px 5px;cursor:pointer;min-width:0}
.md.out{color:var(--faint);background:#fbfaf7}
.md.tod{box-shadow:inset 0 0 0 2px #85B7EB}
.md b{font-size:12px}
.md .l{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md .l i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-inline-end:4px}
.band{display:block;font-size:10px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 4px;margin:2px 0}
.side{position:fixed;top:0;inset-inline-end:0;width:min(400px,100%);height:100%;background:#fff;border-inline-start:1px solid var(--line2);box-shadow:0 0 30px rgba(0,0,0,.12);overflow:auto;padding:16px 18px 40px;z-index:20}
.side h3{margin:0 0 6px;font-size:17px}
.side .x{float:inline-end}
dl{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;margin:12px 0}
dt{color:var(--muted)}dd{margin:0}
.tag{display:inline-block;border-radius:999px;padding:1px 9px;font-size:11px;margin-inline-end:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.msg{border-radius:8px;padding:8px 10px;margin:10px 0;font-size:12px}
.msg.err{background:var(--err-bg);color:var(--err)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.fm label{display:block;margin:8px 0 2px;color:var(--muted);font-size:12px}
.fm input[type=text],.fm select,.fm input[type=date]{width:100%}
.fm .inl{display:flex;gap:8px;align-items:center}
.fm .inl input{width:auto}
.fm .ck{display:inline-flex;gap:4px;align-items:center;margin-inline-end:10px;color:var(--text);font-size:12px}
.hist{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#26292E;color:#fff;padding:8px 16px;border-radius:8px;z-index:30}
.tv{padding:24px 30px;background:#1f2228;color:#fff;min-height:100vh}
.tv h1{font-size:34px;margin:0 0 4px}.tv .sub{color:#b9bcc2;font-size:18px;margin-bottom:22px}
.tvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.tvr{background:#2b2f37;border-radius:14px;padding:14px 18px}
.tvr h3{margin:0 0 8px;font-size:22px}
.tvi{font-size:20px;padding:6px 0;border-top:1px solid #3a3f49;display:flex;gap:14px}
.tvi b{min-width:120px;color:#9fd0ff}
.tvi.now{color:#ffd27a}
.prep h4{margin:16px 0 6px;font-size:13px}
.prep .it{border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin-bottom:5px}
.prep .it small{color:var(--muted);display:block}
@media (max-width:760px){.strip{grid-template-columns:repeat(2,1fr)}.nm{width:96px}}
.cell.sel,.md.sel{background:#d7e8fb!important;box-shadow:inset 0 0 0 1px #378ADD}
.dsel{position:absolute;top:2px;bottom:2px;background:rgba(55,138,221,.25);border:1px solid #378ADD;border-radius:6px;z-index:4;display:none;pointer-events:none;font-size:11px;color:#0C447C;padding:2px 6px}
.dragging,.dragging *{user-select:none;cursor:crosshair!important}
.md .l b{font-weight:600;margin-inline-end:3px}
.fm h4{margin:14px 0 4px;font-size:13px;border-top:1px solid var(--line);padding-top:10px}
.fm .rooms{max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.fm .rooms div{font-size:11px;color:var(--faint);margin-top:4px}
.fm table{width:100%;border-collapse:collapse;font-size:12px}
.fm td{padding:2px 3px}
.fm td input,.fm td select{width:100%;padding:3px 5px}
.fm .lock{color:var(--faint);font-size:12px;background:var(--soft);border-radius:8px;padding:6px 9px}
.tot{background:var(--soft);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px}
.tot b{font-size:14px}
.short{color:var(--err)}
.mini{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
.mini td{border-bottom:1px solid var(--line);padding:3px 4px}
.later{background:#3a3f49;color:#ffd27a;border-radius:10px;padding:8px 14px;margin-bottom:16px;font-size:15px}
</style>
</head>

var OURS=['Workshop','Course','Club','Training','Event','Christian education','Prayer group'];

var STOCK={'Projector':2,'Sound system':1,'Microphone':2,'Whiteboard':3,'Chairs':120,'Tables':30};
var K={Workshop:['#B5D4F4','#0C447C'],Course:['#9FE1CB','#085041'],Club:['#CECBF6','#3C3489'],Training:['#C0DD97','#27500A'],Event:['#FAC775','#633806'],'Christian education':['#F4C0D1','#72243E'],'Prayer group':['#F5C4B3','#712B13'],'Hall booking':['#D3D1C7','#2C2C2A'],'Guest stay':['#FAEEDA','#854F0B'],'Whole centre':['#26292E','#ffffff']};
var ALL7=[0,1,2,3,4,5,6];
var ITEMS=[

 {id:5,origin:'ours',kind:'Workshop',title:'Drawing workshop',leader:'Artist J',rooms:['h1'],day:'2026-11-25',t1:'10:00',t2:'13:00',people:25,status:'confirmed',equip:[{name:'Projector',qty:1},{name:'Chairs',qty:25}]},

 {id:7,origin:'out',kind:'Hall booking',org:'o1',rooms:['h1'],day:'2026-11-03',end:'2027-01-26',t1:'18:00',t2:'20:00',rep:[1],people:35,status:'confirmed',price:{mode:'each',amount:20,cur:'USD'},equip:[{name:'Chairs',qty:35}],pays:[{amount:60,cur:'USD',on:'2026-11-03'}]},
 {id:8,origin:'out',kind:'Hall booking',org:'o2',rooms:['h2'],day:'2026-11-26',t1:'09:00',t2:'12:00',people:30,status:'option',hold:'2026-11-20',price:{mode:'whole',amount:40,cur:'USD'},equip:[{name:'Projector',qty:1}],services:[{name:'Coffee break',qty:30,amount:30,cur:'USD'}]},
 {id:16,origin:'out',kind:'Hall booking',org:'o3',title:'conference',rooms:['c3','c4'],day:'2026-11-26',t1:'09:00',t2:'13:00',people:40,status:'confirmed',price:{mode:'whole',amount:600000,cur:'SYP'},equip:[{name:'Projector',qty:2},{name:'Microphone',qty:1}],services:[{name:'Coffee break',qty:40,amount:200000,cur:'SYP'},{name:'Lunch',qty:40,amount:800000,cur:'SYP'}]},

 {id:14,origin:'out',kind:'Hall booking',org:'o7',rooms:['mr'],day:'2026-11-27',t1:'15:00',t2:'17:00',people:8,status:'confirmed',priv:true,price:{mode:'whole',amount:0,cur:'USD'}},
 {id:15,origin:'ours',kind:'Event',title:'Christmas festival',whole:true,leader:'Director',rooms:[],day:'2026-12-12',end:'2026-12-12',people:300,status:'confirmed'}];
var nextId=100;

// ------------------------------------------------------------------ dates
var WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],WDL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'],MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function D(s){return new Date(s+'T00:00:00Z');}
function iso(d){return d.toISOString().slice(0,10);}
function add(s,n){var d=D(s);d.setUTCDate(d.getUTCDate()+n);return iso(d);}
function wd(s){return (D(s).getUTCDay()+6)%7;}
function mon(s){return add(s,-wd(s));}
function fmt(s){return WD[wd(s)]+' '+(+s.slice(8))+' '+MN[+s.slice(5,7)-1].slice(0,3);}
function fmtL(s){return WDL[wd(s)]+' '+(+s.slice(8))+' '+MN[+s.slice(5,7)-1]+' '+s.slice(0,4);}
function m2(t){var p=t.split(':');return (+p[0])*60+(+p[1]);}
function hm(m){var h=Math.floor(m/60),n=m%60;return (h<10?'0':'')+h+':'+(n<10?'0':'')+n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function closedOn(d){for(var i=0;i<CLOSED.length;i++)if(d>=CLOSED[i].from&&d<=CLOSED[i].to)return CLOSED[i];return null;}
function num(n){return Math.round(n).toLocaleString('en-US');}

// ------------------------------------------------------------------ rules
function isStay(i){return i.kind==='Guest stay';}
function room(id){for(var i=0;i<ROOMS.length;i++)if(ROOMS[i].id===id)return ROOMS[i];}
function org(id){for(var i=0;i<ORGS.length;i++)if(ORGS[i].id===id)return ORGS[i];}
function roomsOf(i){return i.whole?ROOMS.map(function(r){return r.id;}):i.rooms;}
function occurs(i,d){
 if(i.status==='cancelled')return false;
 if(i.skip&&i.skip.indexOf(d)>=0)return false;
 if(isStay(i))return d>=i.day&&d<i.end;
 if(i.whole)return d>=i.day&&d<=i.end;
 if(i.end&&i.end>i.day)return d>=i.day&&d<=i.end&&(i.rep||ALL7).indexOf(wd(d))>=0;
 return d===i.day;}
function span(i){return (isStay(i)||i.whole)?[0,1440]:[m2(i.t1),m2(i.t2)];}
function use(i,d,r){if(!occurs(i,d)||roomsOf(i).indexOf(r)<0)return null;return span(i);}
function datesOf(i){var out=[],d=i.day,last=isStay(i)?add(i.end,-1):(i.end||i.day),n=0;while(d<=last&&n<800){if(occurs(i,d))out.push(d);d=add(d,1);n++;}return out;}
function clashes(nw){var res=[];datesOf(nw).forEach(function(d){roomsOf(nw).forEach(function(r){var a=use(nw,d,r);if(!a)return;ITEMS.forEach(function(o){if(o.id===nw.id)return;var b=use(o,d,r);if(b&&a[0]<b[1]&&b[0]<a[1])res.push({d:d,r:r,o:o});});});});return res;}
/** equipment asked at the same time (any space) by other bookings, against what the inventory holds */
function shortages(it){var res=[];(it.equip||[]).forEach(function(e){if(!STOCK[e.name])return;var worst=null;datesOf(it).forEach(function(d){var a=span(it),other=0;ITEMS.forEach(function(o){if(o.id===it.id||!occurs(o,d))return;var b=span(o);if(!(a[0]<b[1]&&b[0]<a[1]))return;(o.equip||[]).forEach(function(x){if(x.name===e.name)other+=x.qty;});});if(other+e.qty>STOCK[e.name]&&!worst)worst={d:d,name:e.name,want:e.qty,other:other,have:STOCK[e.name]};});if(worst)res.push(worst);});return res;}
function totals(i){var t={USD:0,SYP:0};if(i.price){var n=datesOf(i).length,p=i.price,b=p.mode==='pnight'?p.amount*i.people*n:p.mode==='each'?p.amount*n:p.amount;t[p.cur]+=b;}(i.services||[]).forEach(function(s){if(s.amount)t[s.cur]+=+s.amount;});return t;}
function paid(i){var t={USD:0,SYP:0};(i.pays||[]).forEach(function(p){t[p.cur]+=p.amount;});return t;}
function money(t){var a=[];if(t.USD)a.push(num(t.USD)+' USD');if(t.SYP)a.push(num(t.SYP)+' SYP');return a.join(' + ')||'0';}

function todayFigures(){
 var arrive=ITEMS.filter(function(i){return isStay(i)&&i.status!=='cancelled'&&i.day===TODAY;});
 var leave=ITEMS.filter(function(i){return isStay(i)&&i.status!=='cancelled'&&i.end===TODAY;});
 var halls=ROOMS.filter(function(r){return GRP.halls.indexOf(r.kind)>=0;});
 var nowM=m2(NOW),inUse=halls.filter(function(r){return ITEMS.some(function(i){var u=use(i,TODAY,r.id);return u&&u[0]<=nowM&&nowM<u[1];});});
 var beds=ROOMS.filter(function(r){return r.kind==='Bedroom';}),free=beds.filter(function(r){return !ITEMS.some(function(i){return use(i,TODAY,r.id);});});
 var opt=ITEMS.filter(function(i){return i.status==='option'&&(i.end||i.day)>=TODAY;});
 return{arrive:arrive,leave:leave,inUse:inUse.length,halls:halls.length,free:free.length,beds:beds.length,opt:opt.length};}

function weekView(){

   bars.forEach(function(i){var s=-1,e=-1;days.forEach(function(d,k){if(occurs(i,d)){if(s<0)s=k;e=k;}});
    t+='<div class="bar'+cls(i)+'" style="'+sty(i)+';grid-column:'+(s+1)+'/'+(e+2)+'" data-a="open" data-id="'+i.id+'" data-d="'+days[s]+'">'+mark(i)+esc(label(i))+(i.status==='arrived'?' · arrived':'')+'</div>';});

// ------------------------------------------------------------------ dragging over hours, days and spaces
function cellsBetween(g){g=g||S.drag;return{r0:Math.min(g.r0,g.r1),r1:Math.max(g.r0,g.r1),a:Math.min(g.a0,g.a1),b:Math.max(g.a0,g.a1)};}
function paint(){
 var g=S.drag,c=cellsBetween();
 if(g.mode==='week')[].forEach.call(document.querySelectorAll('.cell'),function(e){var ri=+e.dataset.ri,di=+e.dataset.di;e.classList.toggle('sel',ri>=c.r0&&ri<=c.r1&&di>=c.a&&di<=c.b);});
 if(g.mode==='month')[].forEach.call(document.querySelectorAll('.md'),function(e){var d=e.dataset.d;e.classList.toggle('sel',d>=(g.a0<g.a1?g.a0:g.a1)&&d<=(g.a0<g.a1?g.a1:g.a0));});
 if(g.mode==='day'){var lo=Math.floor(c.a/30)*30,hi=Math.max(lo+30,Math.ceil(c.b/30)*30);
  [].forEach.call(document.querySelectorAll('.dtr'),function(e){var ri=+e.dataset.ri,s=e.querySelector('.dsel');if(ri>=c.r0&&ri<=c.r1){s.style.display='block';s.style.insetInlineStart=pct(lo);s.style.width=((hi-lo)/840*100).toFixed(2)+'%';s.textContent=hm(lo)+'–'+hm(hi);}else s.style.display='none';});}}
function minuteAt(el,x){var rc=el.getBoundingClientRect(),fr=S.mirror?(rc.right-x)/rc.width:(x-rc.left)/rc.width;return Math.max(480,Math.min(1320,480+fr*840));}
document.addEventListener('mousedown',function(e){
 if(e.button!==0||e.target.closest('[data-a]')||e.target.closest('.side'))return;
 var c=e.target.closest('.cell'),t=e.target.closest('.dtr'),m=e.target.closest('.md');
 if(c)S.drag={mode:'week',r0:+c.dataset.ri,r1:+c.dataset.ri,a0:+c.dataset.di,a1:+c.dataset.di};
 else if(t){var mm=minuteAt(t,e.clientX);S.drag={mode:'day',r0:+t.dataset.ri,r1:+t.dataset.ri,a0:mm,a1:mm};}
 else if(m)S.drag={mode:'month',a0:m.dataset.d,a1:m.dataset.d};
 else return;
 e.preventDefault();document.body.classList.add('dragging');paint();});
document.addEventListener('mousemove',function(e){
 var g=S.drag;if(!g)return;
 if(g.mode==='week'){var c=e.target.closest('.cell');if(c){g.r1=+c.dataset.ri;g.a1=+c.dataset.di;}}
 if(g.mode==='day'){var t=e.target.closest('.dtr');if(t){g.r1=+t.dataset.ri;g.a1=minuteAt(t,e.clientX);}}
 if(g.mode==='month'){var m=e.target.closest('.md');if(m)g.a1=m.dataset.d;}
 paint();});
document.addEventListener('mouseup',function(){
 var g=S.drag;if(!g)return;S.drag=null;document.body.classList.remove('dragging');
 var c=cellsBetween(g),bookable=can('out')||can('ours');
 if(g.mode==='month'){var f=g.a0<g.a1?g.a0:g.a1,l=g.a0<g.a1?g.a1:g.a0;if(f===l||!bookable){S.anchor=f;S.view='day';render();return;}openForm(null,{from:f,to:l});return;}
 if(!bookable){render();return;}
 var rooms=VIS.slice(c.r0,c.r1+1);
 if(g.mode==='week'){var m0=mon(S.anchor);openForm(null,{rooms:rooms,from:add(m0,c.a),to:add(m0,c.b)});}
 else{var lo=Math.floor(c.a/30)*30,hi=Math.max(lo+30,Math.ceil(c.b/30)*30);if(hi-lo===30)hi=Math.min(1320,lo+60);openForm(null,{rooms:rooms,from:S.anchor,to:S.anchor,t1:hm(lo),t2:hm(hi)});}});

 x+='<dl>'+(i.status==='option'?'<dt>Held until</dt><dd'+(i.hold&&i.hold<TODAY?' class="short"':'')+'>'+(i.hold?fmt(i.hold)+(i.hold<TODAY?' · the date has passed: call them':''):'—')+'</dd>':'')+'<dt>When</dt><dd>'+when(i)+'</dd><dt>Where</dt><dd>'+(i.whole?'Every space of the centre':roomsOf(i).map(function(r){return room(r).name;}).join(', '))+'</dd>';

  if(i.services&&i.services.length)x+='<dt>Services</dt><dd>'+i.services.map(function(s){return s.qty+' × '+s.name+(can('prices')&&s.amount?' · '+num(s.amount)+' '+s.cur:'');}).join('<br>')+'</dd>';
  if(i.note)x+='<dt>Note</dt><dd>'+esc(i.note)+'</dd>';

 x+='</dl>';
 if(i.origin==='out'&&!hidden){

 if(F.type==='out'){it.kind=F.okind;it.title=F.title.trim();
  if(F.org==='new'){var n=(F.oname||'').trim();if(!n)return 'Write the name of the new organisation.';it.newOrg={id:'o'+it.id,name:n,kind:'Other',person:(F.operson||'').trim(),phone:(F.ophone||'').trim(),note:''};it.org=it.newOrg.id;}
  else if(!F.org)return 'Choose the organisation.';else it.org=F.org;
  it.services=F.services.filter(function(s){return s.qty>0;});
  if(can('prices'))it.price=F.pamount===''?null:{mode:F.pmode,amount:+F.pamount,cur:F.pcur};
  else if(S.side.id){var old=ITEMS.filter(function(z){return z.id===S.side.id;})[0];it.price=old.price;it.services.forEach(function(s){var o=(old.services||[]).filter(function(z){return z.name===s.name;})[0];if(o){s.amount=o.amount;s.cur=o.cur;}});}
  else it.price=null;}
 if(F.type!=='whole'){
  it.rooms=F.rooms.slice();if(!it.rooms.length)return 'Choose at least one space.';
  if(stay){it.end=F.end;if(it.end<=it.day)return 'The leaving day must be after the arrival.';}
  else{it.t1=F.t1;it.t2=F.t2;if(!(it.t1<it.t2))return 'The hours are not right.';if(F.end>F.day){it.end=F.end;it.rep=F.rep.slice().sort();if(!it.rep.length)return 'Choose the days of the week.';}}}
 return it;}
function trySave(force){
 syncF();var it=build(),box=document.getElementById('nmsg');
 if(typeof it==='string'){box.innerHTML='<div class="msg err">'+it+'</div>';return;}
 var cl=clashes(it);
 if(cl.length){
  var bad={};cl.forEach(function(c){bad[c.d]=1;});var badDays=Object.keys(bad),all=datesOf(it);
  var lines=cl.slice(0,8).map(function(c){return fmt(c.d)+' · '+room(c.r).name+' · '+mark(c.o)+esc(label(c.o))+(c.o.t1?' '+c.o.t1+'–'+c.o.t2:'');}).join('<br>')+(cl.length>8?'<br>… and '+(cl.length-8)+' more':'');
  if(all.length>1&&badDays.length<all.length){S.side.pending={it:it,skip:badDays};
   box.innerHTML='<div class="msg err"><b>'+badDays.length+' of '+all.length+' dates are already taken:</b><br>'+lines+'<div class="acts"><button class="btn" data-a="savewithout">Save without '+(badDays.length===1?'this date':'these '+badDays.length+' dates')+'</button></div><small>(round 3, question R1: or refuse all?)</small></div>';}
  else box.innerHTML='<div class="msg err"><b>Not possible: the space is already held.</b><br>'+lines+'<br><small>Change the space, the day or the hours'+(it.whole?'; for the whole centre, our activities must first be moved or cancelled, outside bookings are not moved':'')+'.</small></div>';
  return;}
 var warn=[],ds=datesOf(it);
 if(!isStay(it)&&ds.some(function(d){return wd(d)===6;}))warn.push('Sunday: usually no bookings.');
 var cd=ds.filter(function(d){return closedOn(d);});if(cd.length)warn.push('Closed period ('+closedOn(cd[0]).name+'): '+cd.length+' date(s).');
 shortages(it).forEach(function(s){warn.push('Not enough '+s.name+' on '+fmt(s.d)+': '+(s.other+s.want)+' asked at that time, '+s.have+' in the inventory.');});
 if(warn.length&&!force){box.innerHTML='<div class="msg warn">'+warn.join('<br>')+'</div>';var b=document.getElementById('savebtn');b.textContent='Save anyway';b.setAttribute('data-a','saveforce');return;}
 commit(it);}
function commit(it){
 if(it.newOrg){ORGS.push(it.newOrg);delete it.newOrg;}
 var old=ITEMS.filter(function(z){return z.id===it.id;})[0];
 if(old){it.pays=old.pays;it.hist=(old.hist||[]).slice();it.skip=it.skip||old.skip;it.skipWhy=old.skipWhy;
  var a=old.price?num(old.price.amount)+' '+old.price.cur+' '+PMODE[old.price.mode]:'not set',b=it.price?num(it.price.amount)+' '+it.price.cur+' '+PMODE[it.price.mode]:'not set';
  if(a!==b)it.hist.push('Price '+a+' → '+b+' · by '+S.role+' · '+fmt(TODAY));
  ITEMS[ITEMS.indexOf(old)]=it;}
 else{ITEMS.push(it);nextId++;}
 S.side={t:'open',id:it.id,d:it.day};S.anchor=it.day;render();toast((old?'Changed':'Saved')+(it.status==='option'?' as "to confirm"':''));}
function toast(t){var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove();},2200);}

// ------------------------------------------------------------------ clicks
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;
 var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),id=+el.getAttribute('data-id'),d=el.getAttribute('data-d');
 var item=ITEMS.filter(function(z){return z.id===id;})[0];
 if(a==='open'){e.stopPropagation();if(el.dataset.jump&&d)S.anchor=d;S.side={t:'open',id:id,d:d};}
 else if(a==='prev'||a==='next'){var n=a==='prev'?-1:1;if(S.view==='day')S.anchor=add(S.anchor,n);else if(S.view==='week')S.anchor=add(S.anchor,7*n);else{var y=+S.anchor.slice(0,4),m=+S.anchor.slice(5,7)-1+n;y+=Math.floor(m/12);m=(m%12+12)%12;S.anchor=y+'-'+(m<9?'0':'')+(m+1)+'-01';}}
 else if(a==='today')S.anchor=TODAY;
 else if(a==='view')S.view=v;
 else if(a==='grp')S.grp=v;
 else if(a==='fold')S.fold[v]=!S.fold[v];
 else if(a==='new'){openForm(null,{});return;}
 else if(a==='edit'){openForm(id);return;}
 else if(a==='ftype'){syncF();var F=S.side.f;F.type=v;if(v==='out'&&F.status==='confirmed'&&!S.side.id)F.status='option';if(stayF(F))F.rooms=F.rooms.filter(function(r){return room(r).kind==='Bedroom';});else F.rooms=F.rooms.filter(function(r){return room(r).kind!=='Bedroom';});}
 else if(a==='addequip'){syncF();S.side.f.equip.push({name:'Projector',qty:1});}
 else if(a==='rmequip'){syncF();S.side.f.equip.splice(+v,1);}
 else if(a==='addserv'){syncF();var F2=S.side.f;F2.services.push({name:'Lunch',qty:F2.people||1,amount:'',cur:'USD'});}
 else if(a==='rmserv'){syncF();S.side.f.services.splice(+v,1);}
 else if(a==='prep')S.side={t:'prep'};
 else if(a==='tile')S.side={t:'tile',v:v};
 else if(a==='bookroom'){openForm(null,{rooms:[v],from:TODAY,to:TODAY});return;}
 else if(a==='addcat'){toast('Categories are added in Settings: for example Playground, with Football and Basketball inside.');return;}
 else if(a==='preset'){syncF();S.side.f.t1=v.split('-')[0];S.side.f.t2=v.split('-')[1];}
 else if(a==='close')S.side=null;
 else if(a==='tv')S.tv=!S.tv;
 else if(a==='mirror')S.mirror=!S.mirror;
 else if(a==='save'){trySave(false);return;}
 else if(a==='saveforce'){trySave(true);return;}
 else if(a==='savewithout'){var p=S.side.pending;p.it.skip=(p.it.skip||[]).concat(p.skip);commit(p.it);return;}
 else if(a==='confirm'){if(clashes(item).length){toast('Not possible: the space is taken');return;}item.status='confirmed';toast('Confirmed');}
 else if(a==='arrived'){item.status='arrived';toast('Marked arrived');}
 else if(a==='left'){item.status='left';toast('Marked left');}
 else if(a==='pay'){var amt=prompt('Amount received ('+item.price.cur+')');if(amt===null||amt===''||isNaN(+amt))return;item.pays=item.pays||[];item.pays.push({amount:+amt,cur:item.price.cur,on:TODAY});toast('Payment recorded: a suggestion goes to the books');}
 else if(a==='skip'){var w=prompt('Reason for cancelling '+fmt(d)+' only');if(w===null)return;item.skip=item.skip||[];item.skip.push(d);item.skipWhy=item.skipWhy||{};item.skipWhy[d]=w||'no reason';S.side=null;toast(fmt(d)+' cancelled; the other dates stay');}
 else if(a==='cancel'){var r=prompt('Reason for cancelling');if(r===null)return;item.status='cancelled';item.why=r;S.side=null;toast('Cancelled (kept in the history)');}
 render();});
document.addEventListener('input',function(e){if(e.target.id!=='search')return;S.q=e.target.value;S.side=S.q.trim()?{t:'search'}:null;document.getElementById('sidewrap').innerHTML=sidePanel();});
document.addEventListener('change',function(e){
 if(e.target.id==='role'){S.role=e.target.value;S.side=null;render();return;}
 if(e.target.id==='area'){S.area=e.target.value;render();return;}
 if(e.target.closest('.fm')){
  var b=document.getElementById('savebtn');if(b&&b.getAttribute('data-a')==='saveforce'){b.textContent='Save';b.setAttribute('data-a','save');document.getElementById('nmsg').innerHTML='';}
  if(e.target.dataset.re||e.target.dataset.ef==='name'){syncF();var F=S.side.f;if(e.target.dataset.f==='okind'){F.rooms=[];if(stayF(F)&&F.end<=F.day)F.end=add(F.day,1);F.pmode=stayF(F)?'pnight':'whole';}if(F.end<F.day&&!stayF(F))F.end=F.day;render();}}});
render();
</script>
</body>
