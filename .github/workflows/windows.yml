# Homs Building: builds the Windows installer on GitHub's own Windows computers.
# Runs when a tag building-v1.0.0, building-v1.1.0… is pushed (MAGIS's own tags v… never start it).
# The installer appears on the repository's Releases page.
name: Homs Building - Windows installer

on:
  push:
    tags: ['building-v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles nsis
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: 'Homs Building ${{ github.ref_name }}'
          releaseBody: 'Windows: download the -setup.exe below and install it over the old version. Your data file (.db) is not touched.'
          releaseDraft: false
      - uses: actions/upload-artifact@v4
        with:
          name: homs-building-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
