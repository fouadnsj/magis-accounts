[package]
name = "magis-accounts"
version = "0.1.0"
description = "MAGIS cash accounting (offline)"
edition = "2021"

[lib]
name = "magis_accounts_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
